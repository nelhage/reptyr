name: CI
on:
  pull_request: {}
  push:
    branches:
      - master
    tags:
      - 'reptyr-*.*'
      - 'reptyr-*.*.*'
permissions: read-all

jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    name: "Debian Trixie (${{ matrix.arch }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: apt-get update && apt-get -y install gcc make libcap-dev python3 python3-dev python3-venv
      - if: matrix.arch == 'amd64'
        run: apt-get -y install gcc-multilib
      - run: python3 -m venv venv
      - run: venv/bin/pip install -r test/requirements.txt
      - run: . venv/bin/activate && make PYTHON_CMD=python3 test
      - run: make clean
      - if: matrix.arch == 'amd64'
        run: . venv/bin/activate && env PYTHON_CMD=python3 CFLAGS=-m32 LDFLAGS=-m32 NO_TEST_STEAL=1 make test

  # Architectures without native runners. qemu-user can't emulate
  # ptrace, so these boot a Debian kernel under qemu-system.
  linux-qemu:
    runs-on: ubuntu-latest
    container: debian:trixie
    name: "Debian (${{ matrix.arch }}, QEMU)"
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armhf
            packages: qemu-system-arm
          - arch: ppc64el
            packages: qemu-system-ppc
          - arch: riscv64
            packages: qemu-system-misc opensbi
          - arch: loong64
            packages: qemu-system-misc qemu-efi-loongarch64
    steps:
      # Install git before checking out, so that we get a real git
      # checkout for run.sh to list files from.
      - run: apt-get update && apt-get -y install --no-install-recommends mmdebstrap debian-archive-keyring ca-certificates cpio git ${{ matrix.packages }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: test/qemu/run.sh ${{ matrix.arch }}

  freebsd:
    runs-on: ubuntu-latest
    name: "FreeBSD ${{ matrix.release }}"
    strategy:
      fail-fast: false
      matrix:
        release:
          - "14"
          - "15"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          prepare: |
            pkg install -y gmake python3
            pkg install -y "py$(python3 -c 'import sys; print("%d%d" % sys.version_info[:2])')-pexpect"
          run: |
            gmake
            gmake test PYTHON_CMD=python3
